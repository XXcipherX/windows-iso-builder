name: Build Windows
run-name: >
  ${{ inputs.versions }}
  ${{ fromJSON('{"Pro":"PRO","Home":"HOME"}')[inputs.edition] }}
  ${{ fromJSON('{"x64":"X64","arm64":"ARM64"}')[inputs.architecture] }}
  ${{ fromJSON('{
    "Arabic (Saudi Arabia)":"AR","Bulgarian (Bulgaria)":"BG","Czech (Czech Republic)":"CS","Danish (Denmark)":"DA","German (Germany)":"DE","Greek (Greece)":"EL",
    "English (United Kingdom)":"EN","English (United States)":"EN","Spanish (Spain)":"ES","Spanish (Mexico)":"ES","Estonian (Estonia)":"ET","Finnish (Finland)":"FI",
    "French (Canada)":"FR","French (France)":"FR","Hebrew (Israel)":"HE","Croatian (Croatia)":"HR","Hungarian (Hungary)":"HU","Italian (Italy)":"IT",
    "Japanese (Japan)":"JA","Korean (Korea)":"KO","Lithuanian (Lithuania)":"LT","Latvian (Latvia)":"LV","Norwegian Bokmål (Norway)":"NB",
    "Dutch (Netherlands)":"NL","Polish (Poland)":"PL","Portuguese (Brazil)":"PT","Portuguese (Portugal)":"PT","Romanian (Romania)":"RO","Russian (Russia)":"RU",
    "Slovak (Slovakia)":"SK","Slovenian (Slovenia)":"SL","Serbian (Latin, Serbia)":"SR","Swedish (Sweden)":"SV","Thai (Thailand)":"TH","Turkish (Turkey)":"TR",
    "Ukrainian (Ukraine)":"UK","Chinese (Simplified, China)":"ZH","Chinese (Traditional, Taiwan)":"ZH"
  }')[inputs.language] }}
  ${{ inputs.esd && 'ESD' || '' }}
  ${{ inputs.netfx3 && 'NETFX3' || '' }}
  ${{ inputs.tiny11 && 'TINY11' || '' }}
  ${{ inputs.upload_yandex_disk && 'YANDEX-DISK' || '' }}
  ${{ inputs.test_iso && 'ISO-TEST' || '' }}
  ${{ inputs.test_install && 'INSTALL-TEST' || '' }}

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: "Windows architecture to build"
        type: choice
        options: [x64, arm64]
        default: x64
        required: true
      versions:
        description: "Windows version to build"
        type: choice
        options:
          - Windows 11 25H2
          - Windows 11 26H2
          - Windows 11 Beta
          - Windows 11 26H1
          - Windows 11 Experimental
          - Windows 11 Future Platforms
        default: Windows 11 25H2
        required: true
      edition:
        description: "Windows edition to build"
        type: choice
        options: [Pro, Home]
        default: Pro
        required: true
      language:
        description: "Language"
        type: choice
        options:
          - Arabic (Saudi Arabia)
          - Bulgarian (Bulgaria)
          - Czech (Czech Republic)
          - Danish (Denmark)
          - German (Germany)
          - Greek (Greece)
          - English (United Kingdom)
          - English (United States)
          - Spanish (Spain)
          - Spanish (Mexico)
          - Estonian (Estonia)
          - Finnish (Finland)
          - French (Canada)
          - French (France)
          - Hebrew (Israel)
          - Croatian (Croatia)
          - Hungarian (Hungary)
          - Italian (Italy)
          - Japanese (Japan)
          - Korean (Korea)
          - Lithuanian (Lithuania)
          - Latvian (Latvia)
          - "Norwegian Bokmål (Norway)"
          - Dutch (Netherlands)
          - Polish (Poland)
          - Portuguese (Brazil)
          - Portuguese (Portugal)
          - Romanian (Romania)
          - Russian (Russia)
          - Slovak (Slovakia)
          - Slovenian (Slovenia)
          - Serbian (Latin, Serbia)
          - Swedish (Sweden)
          - Thai (Thailand)
          - Turkish (Turkey)
          - Ukrainian (Ukraine)
          - Chinese (Simplified, China)
          - Chinese (Traditional, Taiwan)
        default: English (United States)
        required: true
      revision:
        description: "Build matching selected version, e.g. 26340.9233 (optional)"
        type: string
        required: false
      esd:
        description: "Use ESD compression"
        type: boolean
        required: true
        default: false
      netfx3:
        description: "Add .NET Framework 3.5"
        type: boolean
        required: true
        default: false
      tiny11:
        description: "Apply Tiny11 optimization (debloat, registry tweaks, system requirements bypass)"
        type: boolean
        required: true
        default: true
      upload_yandex_disk:
        description: "Upload the finished ISO privately to Yandex Disk"
        type: boolean
        required: true
        default: false
      test_iso:
        description: "Run quick ISO validation and Windows PE boot (skipped by full installation test)"
        type: boolean
        required: true
        default: false
      test_install:
        description: "Validate, install x64 Windows in QEMU, and audit first boot"
        type: boolean
        required: true
        default: false
jobs:
  build:
    runs-on: ${{ fromJSON('{"x64":"windows-2025-vs2026","arm64":"windows-11-arm"}')[inputs.architecture] }}
    timeout-minutes: 360
    permissions:
      contents: read
    outputs:
      iso-artifact-id: ${{ steps.upload_iso_artifact.outputs.artifact-id }}
      iso-name: ${{ steps.prepare_artifact.outputs.iso-name }}
      iso-size: ${{ steps.prepare_artifact.outputs.iso-size }}
      iso-sha256: ${{ steps.prepare_artifact.outputs.iso-sha256 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Map inputs
        id: map
        shell: pwsh
        run: |
          $langMap = @{
            'Arabic (Saudi Arabia)'='ar-sa'
            'Bulgarian (Bulgaria)'='bg-bg'
            'Czech (Czech Republic)'='cs-cz'
            'Danish (Denmark)'='da-dk'
            'German (Germany)'='de-de'
            'Greek (Greece)'='el-gr'
            'English (United Kingdom)'='en-gb'
            'English (United States)'='en-us'
            'Spanish (Spain)'='es-es'
            'Spanish (Mexico)'='es-mx'
            'Estonian (Estonia)'='et-ee'
            'Finnish (Finland)'='fi-fi'
            'French (Canada)'='fr-ca'
            'French (France)'='fr-fr'
            'Hebrew (Israel)'='he-il'
            'Croatian (Croatia)'='hr-hr'
            'Hungarian (Hungary)'='hu-hu'
            'Italian (Italy)'='it-it'
            'Japanese (Japan)'='ja-jp'
            'Korean (Korea)'='ko-kr'
            'Lithuanian (Lithuania)'='lt-lt'
            'Latvian (Latvia)'='lv-lv'
            'Norwegian Bokmål (Norway)'='nb-no'
            'Dutch (Netherlands)'='nl-nl'
            'Polish (Poland)'='pl-pl'
            'Portuguese (Brazil)'='pt-br'
            'Portuguese (Portugal)'='pt-pt'
            'Romanian (Romania)'='ro-ro'
            'Russian (Russia)'='ru-ru'
            'Slovak (Slovakia)'='sk-sk'
            'Slovenian (Slovenia)'='sl-si'
            'Serbian (Latin, Serbia)'='sr-latn-rs'
            'Swedish (Sweden)'='sv-se'
            'Thai (Thailand)'='th-th'
            'Turkish (Turkey)'='tr-tr'
            'Ukrainian (Ukraine)'='uk-ua'
            'Chinese (Simplified, China)'='zh-cn'
            'Chinese (Traditional, Taiwan)'='zh-tw'
          }

          $verMap = @{
            'Windows 11 25H2'             = 'win11-25h2'
            'Windows 11 26H2'             = 'win11-26h2'
            'Windows 11 Beta'             = 'win11-beta'
            'Windows 11 26H1'             = 'win11-26h1'
            'Windows 11 Experimental'     = 'win11-experimental'
            'Windows 11 Future Platforms' = 'win11-future-platforms'
          }

          $langCode = $langMap['${{ inputs.language }}']
          $verCode  = $verMap['${{ inputs.versions }}']
          $uupEsd   = ('${{ inputs.esd }}' -eq 'true' -and '${{ inputs.tiny11 }}' -ne 'true')

          if (-not $langCode) {
            throw "Unsupported language mapping: ${{ inputs.language }}"
          }
          if (-not $verCode) {
            throw "Unsupported version mapping: ${{ inputs.versions }}"
          }

          echo "lang=$langCode"    >> $env:GITHUB_OUTPUT
          echo "version=$verCode"  >> $env:GITHUB_OUTPUT
          echo "uup_esd=$uupEsd"   >> $env:GITHUB_OUTPUT

      - name: Free disk space (safe)
        shell: pwsh
        run: |
         Write-Host "Free space before:"
         Get-PSDrive C

         Remove-Item -Recurse -Force "C:\Program Files\Microsoft Visual Studio" -ErrorAction SilentlyContinue
         Remove-Item -Recurse -Force "C:\Program Files (x86)\Microsoft Visual Studio" -ErrorAction SilentlyContinue
         Remove-Item -Recurse -Force "C:\Program Files\Android" -ErrorAction SilentlyContinue
         Remove-Item -Recurse -Force "$env:TEMP\*" -ErrorAction SilentlyContinue
         Remove-Item -Recurse -Force "C:\Windows\Temp\*" -ErrorAction SilentlyContinue

         Write-Host "Free space after:"
         Get-PSDrive C

      - name: Install ADK Deployment Tools (oscdimg)
        if: ${{ inputs.tiny11 }}
        shell: pwsh
        run: |
          $adkPath = "C:\Program Files (x86)\Windows Kits\10\Assessment and Deployment Kit\Deployment Tools"
          if (Test-Path "$adkPath\$env:PROCESSOR_ARCHITECTURE\Oscdimg\oscdimg.exe") {
            Write-Output "ADK Deployment Tools already installed, skipping."
            return
          }
          Write-Output "Downloading Windows ADK setup..."
          $adkSetup = Join-Path $env:RUNNER_TEMP "adksetup.exe"
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/?linkid=2337875" -OutFile $adkSetup -UseBasicParsing
          Write-Output "Installing ADK Deployment Tools (oscdimg)..."
          Start-Process -Wait -FilePath $adkSetup -ArgumentList '/quiet', '/norestart', '/features', 'OptionId.DeploymentTools'
          if (Test-Path "$adkPath\$env:PROCESSOR_ARCHITECTURE\Oscdimg\oscdimg.exe") {
            Write-Output "ADK Deployment Tools installed successfully."
          } else {
            Write-Output "::warning::ADK install may have failed. Tiny11 will fall back to downloading oscdimg.exe."
          }

      # ============================================================
      # STAGE 1: Build Windows ISO via UUP dump
      # ============================================================

      - name: Build Windows ISO (UUP dump)
        shell: pwsh
        env:
          BUILD_REVISION: ${{ inputs.revision }}
        run: |
          # The raw artifact upload calculates the final ISO digest while streaming it.
          $splat = @{
            windowsTargetName    = '${{ steps.map.outputs.version }}'
            destinationDirectory = 'c:/output'
            architecture         = '${{ inputs.architecture }}'
            edition              = '${{ inputs.edition }}'
            lang                 = '${{ steps.map.outputs.lang }}'
            SkipChecksum         = $true
          }

          # If Tiny11 is enabled, skip UUP dump ESD compression (Tiny11 re-compresses it anyway)
          if ('${{ steps.map.outputs.uup_esd }}' -eq 'true') { $splat.esd = $true }
          if ('${{ inputs.netfx3 }}' -eq 'true') { $splat.netfx3 = $true }

          if (-not [string]::IsNullOrWhiteSpace($env:BUILD_REVISION)) {
            $splat.revision = $env:BUILD_REVISION
          }

          .\uup-dump-get-windows-iso.ps1 @splat

      # ============================================================
      # STAGE 2: Tiny11 optimization (optional)
      # ============================================================

      - name: Run Tiny11 optimization
        if: ${{ inputs.tiny11 }}
        shell: pwsh
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force

          $isoPath = $env:ISO_PATH
          if (-not $isoPath -or -not (Test-Path $isoPath)) {
            Write-Error "Built ISO not found at: $isoPath"
            exit 1
          }

          Write-Output "=== Starting Tiny11 Optimization ==="
          Write-Output "Source ISO: $isoPath"
          Write-Output "Timestamp: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')"

          $startTime = Get-Date

          $splat = @{
            ISOPath = $isoPath
            INDEX   = 1
          }
          if ('${{ inputs.esd }}' -eq 'true') { $splat.ESD = $true }

          # INDEX=1: UUP dump builds a single-edition ISO, so the WIM always has index 1
          .\scripts\tiny11maker-headless.ps1 @splat

          $buildTime = (Get-Date) - $startTime
          Write-Output "Tiny11 optimization completed in $($buildTime.TotalMinutes.ToString('F2')) minutes"

      - name: Finalize Tiny11 ISO
        if: ${{ inputs.tiny11 }}
        shell: pwsh
        run: |
          $tiny11Iso = ".\scripts\tiny11.iso"

          if (-not (Test-Path $tiny11Iso)) {
            Write-Error "Tiny11 ISO was not created!"
            Write-Output "Contents of scripts directory:"
            Get-ChildItem -Path ".\scripts" | Format-Table Name, Length, LastWriteTime
            exit 1
          }

          # Replace the original ISO only after the Tiny11 ISO is safely moved in place
          $originalIso = $env:ISO_PATH
          if (-not $originalIso -or -not (Test-Path $originalIso)) {
            Write-Error "Original ISO path is missing or not found: $originalIso"
            exit 1
          }

          $destinationDir = Split-Path $originalIso -Parent
          $baseName = $env:ISO_NAME
          if ($baseName -match '(?i)(.*)(\.iso)$') {
            $isoName = $matches[1] + "_Tiny11" + $matches[2]
          } else {
            $isoName = $baseName + "_Tiny11.iso"
          }
          $newIsoPath = "$destinationDir\$isoName"
          $tempIsoPath = "$newIsoPath.tmp"

          if (Test-Path $tempIsoPath) {
            Remove-Item -Path $tempIsoPath -Force
          }
          Move-Item -Path $tiny11Iso -Destination $tempIsoPath -Force
          if (-not (Test-Path $tempIsoPath)) {
            Write-Error "Temporary Tiny11 ISO move failed: $tempIsoPath"
            exit 1
          }

          if (Test-Path $newIsoPath) {
            Remove-Item -Path $newIsoPath -Force
          }
          Move-Item -Path $tempIsoPath -Destination $newIsoPath -Force
          if (-not (Test-Path $newIsoPath)) {
            Write-Error "Final Tiny11 ISO move failed: $newIsoPath"
            exit 1
          }

          if (Test-Path $originalIso) {
            Remove-Item -Path $originalIso -Force
          }

          $sizeGB = [math]::Round((Get-Item $newIsoPath).Length / 1GB, 2)
          Write-Output "Tiny11 ISO finalized: $isoName (${sizeGB}GB)"

          # Update env for summary and artifact upload
          echo "ISO_NAME=$isoName" >> $env:GITHUB_ENV
          echo "ISO_PATH=$newIsoPath" >> $env:GITHUB_ENV

      # ============================================================
      # STAGE 3: Upload & Summary
      # ============================================================

      - name: Upload ISO artifact
        id: upload_iso_artifact
        uses: actions/upload-artifact@v7
        with:
          path: c:/output/*.ISO
          archive: false
          if-no-files-found: error

      - name: Generate verification instructions
        id: prepare_artifact
        shell: pwsh
        run: |
          $isoPath = $env:ISO_PATH
          $isoDir = Split-Path $isoPath -Parent
          $isoName = Split-Path $isoPath -Leaf
          
          Write-Output "Preparing verification files for $isoName..."

          # A direct (archive: false) artifact digest is the SHA256 of the ISO itself.
          $sha256 = '${{ steps.upload_iso_artifact.outputs.artifact-digest }}'.Trim().ToLowerInvariant()
          if ($sha256 -notmatch '^[0-9a-f]{64}$') {
            throw "GitHub did not return a valid SHA256 digest for the ISO artifact: '$sha256'."
          }
          Set-Content -Encoding ascii -Path "$isoDir\$isoName.sha256" -Value "$sha256 *$isoName"
          
          $instructions = @"
          To verify the authenticity of the ISO file, run the following commands in the folder containing the ISO:
          
          Windows (PowerShell):
          Get-FileHash -Algorithm SHA256 "$isoName"
          
          Linux / macOS:
          sha256sum -c "$isoName.sha256"
          # Or manually:
          sha256sum "$isoName"
          "@
          Set-Content -Encoding utf8 -Path "$isoDir\verify_checksums.txt" -Value $instructions

          $isoSize = (Get-Item -LiteralPath $isoPath).Length
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8 -Value "iso-name=$isoName"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8 -Value "iso-size=$isoSize"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8 -Value "iso-sha256=$sha256"

      - name: Upload verification files
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ISO_NAME }}-verification
          path: |
            c:/output/*.sha256
            c:/output/verify_checksums.txt
          if-no-files-found: error

      - name: Build summary
        shell: pwsh
        env:
          BUILD_REVISION: ${{ inputs.revision }}
        run: |
          $iso = Get-Content (Resolve-Path c:/output/*.json) | ConvertFrom-Json
          $artifactUrl = '${{ steps.upload_iso_artifact.outputs.artifact-url }}'
          $summaryName = "Windows 11 ${{ inputs.edition }} $($iso.version)"

          $checksum = '${{ steps.prepare_artifact.outputs.iso-sha256 }}'

          $optsRow = $null
          $buildOptions = @()
          if ('${{ inputs.esd }}' -eq 'true') {
            if ('${{ inputs.tiny11 }}' -eq 'true') {
              $buildOptions += 'Use ESD compression (Tiny11 final image)'
            } else {
              $buildOptions += 'Use ESD compression'
            }
          }
          if ('${{ inputs.netfx3 }}' -eq 'true') {
            $buildOptions += 'Add .NET Framework 3.5'
          }
          if (-not [string]::IsNullOrWhiteSpace($env:BUILD_REVISION)) {
            $buildOptions += "Revision: $env:BUILD_REVISION"
          }

          if ($buildOptions.Count -gt 0) {
            $optsFormatted = ($buildOptions | ForEach-Object { "<li>$($_)</li>" }) -join ''
            $optsRow = "| Build config | <ul>$optsFormatted</ul> |"
          }

          $tiny11Row = ""
          if ('${{ inputs.tiny11 }}' -eq 'true') {
            $tiny11Row = "| Tiny11 | ✅ Applied (debloat + registry tweaks + bypass) |"
          }

          $yandexDiskRow = ""
          if ('${{ inputs.upload_yandex_disk }}' -eq 'true') {
            $yandexDiskRow = '| Yandex Disk | ⏳ Server-side import runs in the separate Yandex Disk job |'
          }

          Add-Content $env:GITHUB_STEP_SUMMARY @"
          ### FILE INFO:
          | Property | Value |
          | :--- | :--- |
          | Name | $summaryName |
          | Build | $($iso.build) |
          | Architecture | ${{ inputs.architecture }} |
          "@

          if ($optsRow) {
            Add-Content $env:GITHUB_STEP_SUMMARY $optsRow
          }
          if ($tiny11Row) {
            Add-Content $env:GITHUB_STEP_SUMMARY $tiny11Row
          }
          if ($yandexDiskRow) {
            Add-Content $env:GITHUB_STEP_SUMMARY $yandexDiskRow
          }

          Add-Content $env:GITHUB_STEP_SUMMARY @"
          | Checksum | $checksum |
          | Iso | [$env:ISO_NAME]($artifactUrl) |
          | UUP dump | [$($iso.title)]($($iso.uupDump.downloadUrl)) |
          "@

  upload_yandex_disk:
    name: Import ISO to Yandex Disk
    if: ${{ inputs.upload_yandex_disk }}
    needs: build
    concurrency:
      group: yandex-disk-${{ needs.build.outputs.iso-name }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Import ISO from GitHub to Yandex Disk
        id: yandex_import
        continue-on-error: true
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISO_ARTIFACT_ID: ${{ needs.build.outputs.iso-artifact-id }}
          ISO_NAME: ${{ needs.build.outputs.iso-name }}
          ISO_SIZE: ${{ needs.build.outputs.iso-size }}
          ISO_SHA256: ${{ needs.build.outputs.iso-sha256 }}
          YANDEX_DISK_TOKEN: ${{ secrets.YANDEX_DISK_TOKEN }}
        run: |
          ./scripts/upload-yandex-disk.ps1 `
            -ArtifactId ([long] $env:ISO_ARTIFACT_ID) `
            -ISOName $env:ISO_NAME `
            -ExpectedSize ([long] $env:ISO_SIZE) `
            -ExpectedSHA256 $env:ISO_SHA256

      - name: Yandex Disk summary
        if: ${{ always() }}
        shell: pwsh
        run: |
          if ('${{ steps.yandex_import.outcome }}' -eq 'success') {
            $status = '✅ Imported and verified'
            $location = '`${{ steps.yandex_import.outputs.remote_path }}`'
          } else {
            $status = '❌ Import failed; the GitHub ISO artifact remains available'
            $location = 'See the import step log and rerun this job'
          }

          Add-Content $env:GITHUB_STEP_SUMMARY @"
          ### Yandex Disk

          | Property | Value |
          | :--- | :--- |
          | Status | $status |
          | ISO | $location |
          "@

  test_iso:
    name: Validate ISO and boot Windows PE
    if: ${{ inputs.test_iso && !inputs.test_install && inputs.architecture == 'x64' }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download built ISO
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.iso-artifact-id }}
          path: test-input

      - name: Install ISO test dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends dosfstools ovmf qemu-system-x86 wimtools

      - name: Validate ISO and boot Windows PE
        shell: pwsh
        run: |
          $isoFiles = @(
            Get-ChildItem -LiteralPath 'test-input' -File -Recurse |
              Where-Object { $_.Extension -ieq '.iso' }
          )
          if ($isoFiles.Count -ne 1) {
            throw "Expected exactly one ISO in the artifact; found $($isoFiles.Count)."
          }

          ./scripts/test-windows-iso.ps1 `
            -ISOPath $isoFiles[0].FullName `
            -BootTimeoutMinutes 20 `
            -ReportDirectory 'validation-results'

      - name: Add ISO test summary
        if: ${{ always() }}
        shell: pwsh
        run: |
          Add-Content $env:GITHUB_STEP_SUMMARY '### ISO validation and Windows PE boot test'
          if (Test-Path -LiteralPath 'validation-results/iso-validation.log') {
            Add-Content $env:GITHUB_STEP_SUMMARY '```text'
            Get-Content -LiteralPath 'validation-results/iso-validation.log' -Tail 80 |
              Add-Content $env:GITHUB_STEP_SUMMARY
            Add-Content $env:GITHUB_STEP_SUMMARY '```'
          }
          else {
            Add-Content $env:GITHUB_STEP_SUMMARY 'The test stopped before a validation report was created.'
          }

      - name: Upload ISO test diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: iso-test-diagnostics
          path: validation-results/
          if-no-files-found: warn

  test_install:
    name: Install Windows and audit first boot
    if: ${{ inputs.test_install && inputs.architecture == 'x64' }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Free disk space for installation test
        shell: bash
        run: |
          echo "Free space before:"
          df -h / /mnt || true

          sudo rm -rf -- \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /usr/share/swift \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL
          sudo apt-get clean

          echo "Free space after:"
          df -h / /mnt || true

      - name: Install full test dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends dosfstools ovmf qemu-system-x86 qemu-utils wimtools

      - name: Download built ISO
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.iso-artifact-id }}
          path: test-input

      - name: Validate ISO structure
        shell: pwsh
        run: |
          $isoFiles = @(
            Get-ChildItem -LiteralPath 'test-input' -File -Recurse |
              Where-Object { $_.Extension -ieq '.iso' }
          )
          if ($isoFiles.Count -ne 1) {
            throw "Expected exactly one ISO in the artifact; found $($isoFiles.Count)."
          }

          ./scripts/test-windows-iso.ps1 `
            -ISOPath $isoFiles[0].FullName `
            -SkipBoot `
            -ReportDirectory 'install-results/iso-validation'

      - name: Install Windows and audit first boot
        shell: pwsh
        run: |
          $isoFiles = @(
            Get-ChildItem -LiteralPath 'test-input' -File -Recurse |
              Where-Object { $_.Extension -ieq '.iso' }
          )
          if ($isoFiles.Count -ne 1) {
            throw "Expected exactly one ISO in the artifact; found $($isoFiles.Count)."
          }

          $splat = @{
            ISOPath         = $isoFiles[0].FullName
            TimeoutMinutes  = 75
            ReportDirectory = 'install-results'
          }
          if ('${{ inputs.tiny11 }}' -eq 'true') {
            $splat.AuditTiny11 = $true
          }

          ./scripts/test-windows-install.ps1 @splat

      - name: Add installation test summary
        if: ${{ always() }}
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath 'install-results/iso-validation/iso-validation.log') {
            Add-Content $env:GITHUB_STEP_SUMMARY '### ISO structural validation'
            Add-Content $env:GITHUB_STEP_SUMMARY '```text'
            Get-Content -LiteralPath 'install-results/iso-validation/iso-validation.log' -Tail 80 |
              Add-Content $env:GITHUB_STEP_SUMMARY
            Add-Content $env:GITHUB_STEP_SUMMARY '```'
          }

          if (Test-Path -LiteralPath 'install-results/install-test-summary.md') {
            Get-Content -LiteralPath 'install-results/install-test-summary.md' |
              Add-Content $env:GITHUB_STEP_SUMMARY
          }
          elseif (Test-Path -LiteralPath 'install-results/windows-install-test.log') {
            Add-Content $env:GITHUB_STEP_SUMMARY '### Full Windows installation test'
            Add-Content $env:GITHUB_STEP_SUMMARY '```text'
            Get-Content -LiteralPath 'install-results/windows-install-test.log' -Tail 80 |
              Add-Content $env:GITHUB_STEP_SUMMARY
            Add-Content $env:GITHUB_STEP_SUMMARY '```'
          }
          else {
            Add-Content $env:GITHUB_STEP_SUMMARY 'The installation test did not start or stopped before a report was created.'
          }

      - name: Upload installation test diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-install-test-diagnostics
          path: install-results/
          if-no-files-found: warn
